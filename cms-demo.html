<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Talha Bilal Store — CMS Demo</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#17191d;--muted:#70757d;--line:#e5e7eb;--accent:#ff6a00;--nav:#15171b;--success:#18864b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.layout{min-height:100vh;display:none;grid-template-columns:245px 1fr}body.cms-authenticated .layout{display:grid}.auth-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.auth-shell{width:100%;max-width:520px}body.cms-authenticated #authGate{display:none}.sidebar{background:var(--nav);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:800;padding:0 10px 26px}.brand small{display:block;color:#969ba4;font-size:11px;font-weight:500;margin-top:4px}.nav button{display:block;width:100%;border:0;background:transparent;color:#c9ccd1;text-align:left;padding:11px 12px;border-radius:9px;margin:3px 0}.nav button:hover,.nav button.active{background:#282b31;color:#fff}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.demo-badge{font-size:12px;font-weight:700;color:#9a4d00;background:#fff1e7;padding:7px 10px;border-radius:999px}.content{padding:28px;max-width:1400px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.page-head h1{font-size:25px;margin:0 0 5px}.page-head p{margin:0;color:var(--muted);font-size:14px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 14px;font-weight:650}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.card{padding:18px}.card span{display:block;color:var(--muted);font-size:12px}.card strong{font-size:23px;display:block;margin-top:8px}.panel{padding:20px;margin-top:18px}.panel h2{font-size:17px;margin:0 0 15px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef8f1;color:var(--success);font-size:11px;font-weight:700}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d9dce1;border-radius:8px;padding:10px 11px;background:#fff}.field textarea{min-height:105px;resize:vertical}.section-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hint{font-size:12px;color:var(--muted);margin-top:6px}.item-list{display:grid;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:15px;border:1px solid var(--line);padding:14px;border-radius:9px}.item strong{font-size:14px}.item small{display:block;color:var(--muted);margin-top:3px}.item-actions{display:flex;gap:7px}.danger{color:#b42318}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:12px}.brand{padding:8px 10px}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;width:auto}.cards{grid-template-columns:1fr 1fr}}@media(max-width:600px){.content{padding:18px}.topbar{padding:0 18px}.cards,.form-grid{grid-template-columns:1fr}.page-head{flex-direction:column}}
 .live-extra{padding:10px 12px;border-radius:9px;background:#eef5ff;color:#174ea6;font-size:12px;font-weight:700}.login-card{max-width:430px;margin:60px auto}.live-error{color:#b42318;font-size:13px;margin-top:10px}.live-table td,.live-table th{white-space:nowrap}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid #d9dce1;border-radius:8px;padding:9px;background:#fff}
.topbar-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#logoutBtn{display:none;background:#fff;color:#23262b;border:1px solid #d5d9df}
body.cms-authenticated #logoutBtn{display:inline-block}
.field-help{font-size:12px;color:var(--muted);margin:5px 0 0;line-height:1.45}
.record-thumb{width:66px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#f3f4f6;display:block}
.record-title{font-weight:750}.record-meta{font-size:12px;color:var(--muted);margin-top:4px}
.preview-frame{margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:9px;background:#f8fafc}
.preview-frame img{max-width:100%;max-height:220px;object-fit:contain;display:block;border-radius:6px}
.assignment-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.assignment-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;min-width:0}
.assignment-item input{width:17px;height:17px;flex:0 0 auto}.assignment-item .assignment-copy{min-width:0}
.assignment-item strong{display:block;font-size:13px}
.assignment-item small{display:block;color:var(--muted);font-size:11px;margin-top:3px;overflow-wrap:anywhere}
.module-note{padding:12px 14px;border:1px solid #e4e7ec;background:#f9fafb;border-radius:10px;color:#505864;font-size:12px;line-height:1.55;margin-bottom:14px}
.module-note strong{color:#20242a}.cms-editor textarea#blogContent{min-height:340px}.table .item-actions{white-space:nowrap}
@media(max-width:900px){.topbar-tools{justify-content:flex-end}.topbar{gap:10px}.assignment-list{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.topbar-tools{gap:6px}.live-extra{max-width:165px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.assignment-list{grid-template-columns:1fr}}


#backBtn{display:none;background:#fff;color:#20242a;border:1px solid #d5d9df}
body.cms-back-visible #backBtn{display:inline-block}
#cmsHomepageBanners[hidden]{display:none!important}
.cms-upload-field input[type=file]{display:block;width:100%;max-width:100%;margin-top:7px;padding:10px;background:#fafafa;border:1px dashed #cbd0d8;border-radius:8px}
.cms-upload-status{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}


.cms-rich-toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:#f4f6f8}
.cms-rich-toolbar button{min-width:38px;padding:7px 10px;background:#fff;color:#17191d;border:1px solid #d4d8de;border-radius:6px;font-size:13px;cursor:pointer}
.cms-rich-toolbar button:hover{background:#e9edf2}
.cms-rich-editor{min-height:360px;max-height:65vh;overflow:auto;padding:16px;border:1px solid var(--line);border-radius:0 0 10px 10px;background:#fff;color:#20242a;font-size:15px;line-height:1.7;outline:none}
.cms-rich-editor:focus{border-color:#7b9fe3;box-shadow:0 0 0 2px #dbeafe}
.cms-rich-editor h2{font-size:26px;line-height:1.25;margin:24px 0 10px}
.cms-rich-editor h3{font-size:21px;line-height:1.3;margin:20px 0 8px}
.cms-rich-editor p{margin:0 0 14px}
.cms-rich-editor ul,.cms-rich-editor ol{padding-left:24px;margin:10px 0 16px}
.cms-rich-editor blockquote{margin:15px 0;padding:10px 16px;border-left:4px solid #f97316;background:#f8fafc;color:#4b5563}
.cms-rich-editor img{max-width:100%;height:auto;border-radius:8px}
.cms-rich-editor a{color:#1d4ed8;text-decoration:underline}
.category-search-wrap{display:block;margin:5px 0 8px}
.category-search-wrap input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line);border-radius:8px}

</style>
</head>
<body>
<div id="authGate" class="auth-gate"><div class="auth-shell"><div class="panel">Checking secure CMS access…</div></div></div>
<div class="layout">
<aside class="sidebar">
<div class="brand">Talha Bilal Store<small>Custom CMS • SAFE PREVIEW</small></div>
<nav class="nav" id="nav">
<button data-page="dashboard" class="active">Dashboard</button>
<button data-page="products">Products</button>
<button data-page="categories">Categories</button>
<button data-page="pages">Website Pages</button>
<button data-page="banners">Banners &amp; Sliders</button>
<button data-page="blog">Blog Posts</button>
<button data-page="seo">SEO Manager</button>
</nav>
</aside>
<main class="main">
<header class="topbar"><strong id="crumb">Dashboard</strong><div class="topbar-tools"><button class="btn" id="backBtn" type="button" onclick="cmsGoBack()">← Back</button><span class="live-extra" id="liveState">Checking secure CMS access…</span><button class="btn" id="logoutBtn" type="button" onclick="logoutCMS()">Logout</button></div></header>
<div class="content" id="app"></div>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n<script>
const seed={
products:[{name:'Mango Premix Drink — 1kg',price:'450',status:'Active'},{name:'Mango Premix Drink — 2kg',price:'800',status:'Active'},{name:'Mango Premix Drink — 5kg',price:'1850',status:'Active'}],
pages:[{name:'Homepage',sections:'Hero • Featured Products • Reviews • FAQ • CTA'},{name:'Why Us',sections:'Quality • 60% Mango Pulp • Easy Ordering'},{name:'How to Order',sections:'Order Steps • COD • Delivery'}],
blog:[{title:'How to Make Mango Drink from Mango Pulp Premix',status:'Published'},{title:'Where to Buy Mango Pulp in Pakistan',status:'Published'}],
reviews:[{name:'Sample Customer',rating:'5',text:'Excellent taste and quality.'}],
faqs:[{q:'How do I place an order?',a:'Choose a product and complete the COD form.'},{q:'Do you deliver across Pakistan?',a:'Yes, delivery is available across Pakistan.'}],
seo:{homeTitle:'Talha Bilal Store | Mango Pulp Drink Premix',homeMeta:'Shop Mango Pulp Drink Premix in 1kg to 10kg packs with Cash on Delivery across Pakistan.'},
settings:{store:'Talha Bilal Store',whatsapp:'0311 9167630',announcement:'Cash on Delivery — All Over Pakistan'}
};
function load(){try{return JSON.parse(localStorage.getItem('tbsCmsDemo'))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
let db=load();function save(){localStorage.setItem('tbsCmsDemo',JSON.stringify(db))}
const app=document.getElementById('app'),crumb=document.getElementById('crumb');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function head(title,sub,action=''){return '<div class="page-head"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+action+'</div>'}
function render(page='dashboard'){
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));crumb.textContent=page==='dashboard'?'Dashboard':page.replace(/^./,x=>x.toUpperCase());
if(page==='dashboard')return dashboard();
if(page==='products')return products();
if(page==='pages')return pages();
if(page==='blog')return blog();
if(page==='reviews')return reviews();
if(page==='faqs')return faqs();
if(page==='seo')return seo();
if(page==='settings')return settings();
if(page==='orders')return orders();
if(page==='finance')return finance();
if(page==='promotions')return promotions();
if(page==='meta')return meta();
if(page==='media')return media();
if(page==='homepage')return homepage();
if(page==='banners')return banners();
if(page==='categories')return categories();
if(page==='attributes')return attributes();
if(page==='audit')return audit();
}

async function orders(){app.innerHTML=head('Orders','Read-only preview of the existing order system. No order editing is enabled here.')+demoRows('Recent Orders',['Order','Customer','Weight','Sales','Status'],[
['TB-10482','Muhammad Ali','2kg','Rs. 900','Shipped'],
['TB-10481','Ayesha Khan','1kg','Rs. 450','Delivered'],
['TB-10480','Hassan Raza','5kg','Rs. 2,150','In Transit'],
['TB-10479','Sana Malik','1kg','Rs. 450','Delivery Failed']
])+'<div class="panel"><h2>Safety</h2><p class="hint">The production Orders/Finance admin remains untouched. The final CMS can mirror these records through secured read access and later add approved workflows.</p></div><div class="panel"><div class="table-wrap"><table class="table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr><tr><td>Live data connection planned</td><td>Existing orders</td><td>Read-only</td><td>Protected</td></tr></table></div></div>'}
async function finance(){app.innerHTML=head('Finance','Read-only preview of the existing finance system.')+demoRows('Monthly Finance Sample',['Metric','September'],[
['Total Sales','Rs. 48,650'],
['Product Cost','Rs. 21,875'],
['Delivery Cost','Rs. 6,742'],
['Ads Cost','Rs. 9,368'],
['Packaging','Rs. 2,756'],
['Return / Failed Loss','Rs. 1,040'],
['Realized Profit / Loss','Rs. 6,869'],
['ROI','31.4%']
])+'<div class="cards"><div class="card"><span>Product Cost</span><strong>Existing Formula</strong></div><div class="card"><span>Delivery Cost</span><strong>Existing Formula</strong></div><div class="card"><span>Ads Cost / Share</span><strong>Existing Formula</strong></div><div class="card"><span>ROI / P&L</span><strong>Existing Formula</strong></div></div><div class="panel"><p class="hint">All current finance formulas, pagination, monthly P/L, failed-return loss, ROI and ads allocation stay in the current admin until the CMS replacement is fully tested.</p></div>'}
function promotions(){app.innerHTML=head('Deals & Promotions','Conversion tools with real start/end dates and customer-facing countdowns.','<button class="btn primary" onclick="alert(\'Demo: promotion editor\')">+ New Promotion</button>')+demoRows('Active Deals',['Promotion','Type','Value','Ends'],[
['Mango Weekend','Percentage','10%','04 Oct 2026 23:59'],
['8kg Family Bundle','Bundle','Save Rs. 250','06 Oct 2026 23:59'],
['Free Shipping','Free shipping','Above Rs. 2,500','30 Oct 2026']
])+'<div class="cards"><div class="card"><span>Percentage / Fixed</span><strong>Ready</strong></div><div class="card"><span>Bundles</span><strong>Ready</strong></div><div class="card"><span>Free Shipping</span><strong>Ready</strong></div><div class="card"><span>Countdown</span><strong>Real expiry</strong></div></div><div class="panel"><h2>Conversion toolkit</h2><p>Limited-time offers, bundles, quantity discounts, free-shipping thresholds, best-seller/new badges, honest low-stock messaging, social proof, sticky mobile CTA, WhatsApp CTA, delivery estimates and related products.</p></div>'}
function meta(){app.innerHTML=head('Meta Ads','Secure server-side API integration area.')+demoRows('Campaign Performance Sample',['Campaign','Spend','Purchases','Revenue','ROAS'],[
['Mango Sales - Lahore','Rs. 4,820','7','Rs. 12,950','2.69x'],
['8kg Bundle Test','Rs. 2,110','4','Rs. 8,400','3.98x'],
['Retargeting','Rs. 1,740','3','Rs. 5,850','3.36x']
])+'<div class="cards"><div class="card"><span>Ad Accounts</span><strong>Planned</strong></div><div class="card"><span>Campaigns</span><strong>Planned</strong></div><div class="card"><span>Spend</span><strong>Planned</strong></div><div class="card"><span>ROAS</span><strong>Planned</strong></div></div><div class="panel"><h2>Important</h2><p class="hint">Meta access tokens must never be stored in browser code. The final integration will use a server-side function and then connect spend → orders → sales → profit/ROI.</p></div>'}
function media(){app.innerHTML=head('Media Library','Reusable product images, banners, blog media, logos and video assets.','<button class="btn primary" onclick="alert(\'Demo media uploader\')">+ Add Media</button>')+'<div class="panel"><div class="item-list"><div class="item"><div><strong>Product Images</strong><small>Upload, replace, reorder, alt text and reuse.</small></div><span class="status">Ready</span></div><div class="item"><div><strong>Homepage Creative</strong><small>Desktop + mobile banner assets.</small></div><span class="status">Ready</span></div><div class="item"><div><strong>Blog / SEO Media</strong><small>Featured images and social/OG assets.</small></div><span class="status">Ready</span></div></div></div>'}
function homepage(){app.innerHTML=head('Homepage Builder','Visual section management without editing HTML.','<button class="btn primary" onclick="alert(\'Demo section editor\')">+ Add Section</button>')+'<div class="panel"><div class="item-list">'+['Announcement Bar','Hero / Slider','Featured Products','Best Sellers','Promotion Banner','Why Choose Us','Reviews / Social Proof','FAQ','Blog','Trust / COD','CTA / WhatsApp','Footer'].map((x,i)=>'<div class="item"><div><strong>'+x+'</strong><small>Show / hide • reorder • duplicate • desktop/mobile settings</small></div><span class="status">'+(i<3?'Active':'Ready')+'</span></div>').join('')+'</div></div>'}
function banners(){app.innerHTML=head('Banners / Slider','Schedule creative with desktop/mobile images, CTA and start/end dates.','<button class="btn primary" onclick="alert(\'Demo banner editor\')">+ Add Banner</button>')+'<div class="panel"><p class="hint">Supports homepage hero, promotional banners, slider ordering, mobile-specific creative and real campaign scheduling.</p></div>'}
function categories(){app.innerHTML=head('Categories','Create parent categories and subcategories with images, SEO and sorting.','<button class="btn primary" onclick="alert(\'Demo category editor\')">+ Add Category</button>')+'<div class="panel"><div class="item-list"><div class="item"><div><strong>Parent / Subcategory</strong><small>Drag/sort • active/inactive • SEO</small></div><span class="status">Ready</span></div></div></div>'}
function attributes(){app.innerHTML=head('Product Attributes','Optional attributes can be enabled only when relevant.')+'<div class="cards"><div class="card"><span>Mango</span><strong>Weight</strong></div><div class="card"><span>Clothing</span><strong>Size + Color</strong></div><div class="card"><span>Electronics</span><strong>Storage + Color</strong></div><div class="card"><span>Custom</span><strong>Any Attribute</strong></div></div><div class="panel"><p class="hint">No irrelevant fields are forced on products. Attribute definitions are stored per product/variant.</p></div>'}
function audit(){app.innerHTML=head('Change History','Future CMS writes will record user, time, action and before/after values.')+'<div class="panel"><p class="hint">Audit log foundation is included in the new CMS database. Existing admin history is not modified.</p></div>'}

function demoRows(title,cols,rows){return '<div class="panel"><h2>'+title+'</h2><div class="table-wrap"><table class="table"><tr>'+cols.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table></div></div>'}
function dashboard(){app.innerHTML=head('CMS Dashboard','A safe demo of the future content management system.')+'<div class="cards"><div class="card"><span>Products</span><strong>'+db.products.length+'</strong></div><div class="card"><span>Website Pages</span><strong>'+db.pages.length+'</strong></div><div class="card"><span>Blog Posts</span><strong>'+db.blog.length+'</strong></div><div class="card"><span>Reviews</span><strong>'+db.reviews.length+'</strong></div></div><div class="panel"><h2>What this demo proves</h2><p class="hint">This separate CMS can eventually control website content without touching the existing Orders / Finance admin. Right now all demo edits stay inside this browser using local storage. No production Supabase data is changed.</p></div>'}
function products(){app.innerHTML=head('Products','Manage names, prices, descriptions, images, pack sizes and SEO in the future.','<button class="btn primary" onclick="addProduct()">+ Add Product</button>')+'<div class="panel"><div class="item-list">'+db.products.map((p,i)=>'<div class="item"><div><strong>'+esc(p.name)+'</strong><small>Rs. '+esc(p.price)+' • '+esc(p.status)+'</small></div><div class="item-actions"><button class="btn" onclick="editProduct('+i+')">Edit</button><button class="btn danger" onclick="removeItem(\'products\','+i+')">Delete</button></div></div>').join('')+'</div></div>'}
function addProduct(){db.products.push({name:'New Product',price:'0',status:'Active'});save();render('products');editProduct(db.products.length-1)}
function editProduct(i){const p=db.products[i];app.innerHTML=head('Edit Product','Demo editor — changes are local to this demo.')+'<div class="panel"><div class="form-grid"><div class="field full"><label>Product Name</label><input id="pn" value="'+esc(p.name)+'"></div><div class="field"><label>Price</label><input id="pp" value="'+esc(p.price)+'"></div><div class="field"><label>Status</label><select id="ps"><option '+(p.status==='Active'?'selected':'')+'>Active</option><option '+(p.status==='Draft'?'selected':'')+'>Draft</option></select></div></div><div class="section-actions"><button class="btn" onclick="render(\'products\')">Cancel</button><button class="btn primary" onclick="saveProduct('+i+')">Save Product</button></div></div>'}
function saveProduct(i){db.products[i].name=document.getElementById('pn').value;db.products[i].price=document.getElementById('pp').value;db.products[i].status=document.getElementById('ps').value;save();render('products')}
function pages(){app.innerHTML=head('Website Content','Control homepage and static-page sections from one place.','<button class="btn primary" onclick="addPage()">+ Add Page</button>')+'<div class="panel"><div class="item-list">'+db.pages.map((p,i)=>'<div class="item"><div><strong>'+esc(p.name)+'</strong><small>'+esc(p.sections)+'</small></div><div class="item-actions"><button class="btn" onclick="editPage('+i+')">Edit</button><button class="btn danger" onclick="removeItem(\'pages\','+i+')">Delete</button></div></div>').join('')+'</div></div>'}
function addPage(){db.pages.push({name:'New Page',sections:'New Section'});save();render('pages')}
function editPage(i){const p=db.pages[i];app.innerHTML=head('Edit Page','In the final CMS this becomes a section editor with show/hide and reorder controls.')+'<div class="panel"><div class="form-grid"><div class="field"><label>Page Name</label><input id="pg" value="'+esc(p.name)+'"></div><div class="field"><label>Sections</label><input id="psx" value="'+esc(p.sections)+'"></div></div><div class="section-actions"><button class="btn" onclick="render(\'pages\')">Cancel</button><button class="btn primary" onclick="db.pages['+i+'].name=document.getElementById(\'pg\').value;db.pages['+i+'].sections=document.getElementById(\'psx\').value;save();render(\'pages\')">Save Page</button></div></div>'}
function blog(){app.innerHTML=head('Blog','Create, edit, draft and publish articles with SEO fields.','<button class="btn primary" onclick="addBlog()">+ New Post</button>')+'<div class="panel"><div class="item-list">'+db.blog.map((p,i)=>'<div class="item"><div><strong>'+esc(p.title)+'</strong><small>'+esc(p.status)+'</small></div><div class="item-actions"><button class="btn" onclick="editBlog('+i+')">Edit</button><button class="btn danger" onclick="removeItem(\'blog\','+i+')">Delete</button></div></div>').join('')+'</div></div>'}

async function cmsRequest(table, method="GET", id=null, data=null){
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(!session) throw new Error("Please sign in again.");
 const u=SUPABASE_URL+"/functions/v1/cms-manage?table="+encodeURIComponent(table)+(id!==null?"&id="+encodeURIComponent(id):"");
 const response=await fetch(u,{method,headers:{"Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_KEY,"Content-Type":"application/json"},...(method==="GET"||method==="DELETE"?{}:{body:JSON.stringify({data})})});
 const payload=await response.json().catch(()=>({error:"Invalid server response"}));
 if(!response.ok||!payload.ok) throw new Error(payload.error||("Request failed: "+response.status));
 return payload.data;
}

async function cmsUploadFiles(input,targetId,folder,mode){
 const status=document.getElementById("upload-status-"+targetId),target=document.getElementById(targetId);
 if(!input||!input.files||!input.files.length||!target)return;
 if(status)status.textContent="Uploading image(s)…";
 input.disabled=true;
 try{
  const result=await supabaseClient.auth.getSession(),session=result?.data?.session;
  if(!session)throw new Error("Your login expired. Sign in again and retry.");
  await cmsRequest("cms_products");
  const urls=[];
  for(const file of Array.from(input.files)){
   if(!/^image\/(jpeg|png|webp|gif|avif)$/i.test(file.type))throw new Error(file.name+": choose a JPG, PNG, WEBP, GIF or AVIF image.");
   if(file.size>8*1024*1024)throw new Error(file.name+": image must be 8 MB or smaller.");
   const cleanName=file.name.normalize("NFKD").replace(/[^a-zA-Z0-9._-]+/g,"-").replace(/^-+|-+$/g,"").slice(-100)||"image";
   const nonce=(window.crypto&&typeof window.crypto.randomUUID==="function")?window.crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2));
   const path=folder+"/"+Date.now()+"-"+nonce+"-"+cleanName;
   const uploaded=await supabaseClient.storage.from("cms-assets").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});
   if(uploaded.error)throw new Error(uploaded.error.message||"Image upload failed.");
   const publicUrl=supabaseClient.storage.from("cms-assets").getPublicUrl(uploaded.data.path).data.publicUrl;
   if(!publicUrl)throw new Error("Could not create a public image URL.");
   urls.push(publicUrl);
   try{await cmsRequest("cms_media","POST",null,{name:file.name,url:publicUrl,type:"image",alt_text:null,folder})}catch(e){console.warn("Media library index did not save",e)}
   const alt=file.name.replace(/\.[^.]+$/,"").replace(/[-_]+/g," ").trim().replace(/["<>]/g,"");
   if(mode==="inline"&&target.isContentEditable){
    target.focus();
    const selection=window.getSelection();
    if(selection&&cmsSavedRichRange&&target.contains(cmsSavedRichRange.commonAncestorContainer)){
     selection.removeAllRanges();selection.addRange(cmsSavedRichRange);
    }
    const figure=document.createElement("figure");
    const img=document.createElement("img");img.src=publicUrl;img.alt=alt;img.loading="lazy";
    figure.appendChild(img);
    if(selection&&selection.rangeCount&&target.contains(selection.getRangeAt(0).commonAncestorContainer)){
     const range=selection.getRangeAt(0);range.deleteContents();range.insertNode(figure);
     range.setStartAfter(figure);range.collapse(true);selection.removeAllRanges();selection.addRange(range);
     cmsSavedRichRange=range.cloneRange();
    }else{target.appendChild(figure)}
   }else if(mode==="inline"){
    const markup='\n<figure><img src="'+publicUrl+'" alt="'+alt+'"></figure>\n';
    const start=Number.isInteger(target.selectionStart)?target.selectionStart:target.value.length;
    const end=Number.isInteger(target.selectionEnd)?target.selectionEnd:start;
    target.setRangeText(markup,start,end,"end");
   }else if(mode==="append-lines"){
    target.value=[target.value.trim(),publicUrl].filter(Boolean).join("\n");
   }else{target.value=publicUrl}
   target.dispatchEvent(new Event("input",{bubbles:true}));
  }
  if(status)status.textContent="Upload complete: "+urls.length+" image"+(urls.length===1?"":"s")+". Press Save Changes to save the image.";
 }catch(e){if(status)status.textContent=e instanceof Error?e.message:"Image upload failed. Check the file and try again."}
 finally{input.disabled=false;input.value=""}
}

async function cmsSyncProductAssignments(productId,categoryId,featured,customPageIds){
 const pages=await cmsRequest("cms_pages");
 const cats=await cmsRequest("cms_categories");
 const category=cats.find(x=>Number(x.id)===Number(categoryId));
 const selected=new Set((customPageIds||[]).map(Number));
 const categorySlugs=category?[category.slug,"category-"+category.slug]:[];
 for(const page of pages){
  const slug=String(page.slug||"");
  const isHome=["home","homepage"].includes(slug);
  const isAllProducts=slug==="products";
  const isCategoryPage=categorySlugs.includes(slug);
  const sections=Array.isArray(page.sections)?page.sections:[];
  const section=sections.find(x=>x&&x.key==="cms-product-assignments");
  const current=Array.isArray(section?.product_ids)?section.product_ids.map(Number):[];
  let manage=false,include=false;
  if(isAllProducts){manage=true;include=true}
  else if(isHome){manage=true;include=!!featured}
  else if(isCategoryPage){manage=true;include=true}
  else if(selected.has(Number(page.id))||current.includes(Number(productId))){manage=true;include=selected.has(Number(page.id))}
  if(!manage)continue;
  const next=include?[...new Set([...current,Number(productId)])]:current.filter(id=>id!==Number(productId));
  if(next.length===current.length&&next.every((x,i)=>x===current[i]))continue;
  const newSections=sections.filter(x=>!(x&&x.key==="cms-product-assignments"));
  if(next.length)newSections.push({type:"product-grid",key:"cms-product-assignments",title:isHome?"Featured Products":"Assigned Products",product_ids:next});
  await cmsRequest("cms_pages","PATCH",page.id,{sections:newSections});
 }
}

function cmsEditorSafeHtml(value){
 const raw=String(value||"").trim();
 if(!raw)return "";
 const hasMarkup=/<(?:h[1-6]|p|div|img|ul|ol|li|section|header|figure|table|blockquote|a|hr|br|strong|em)\b/i.test(raw);
 const initial=hasMarkup?raw:raw.split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean).map(x=>"<p>"+esc(x).replace(/\n/g,"<br>")+"</p>").join("");
 const template=document.createElement("template");template.innerHTML=initial;
 template.content.querySelectorAll("script,iframe,object,embed,form").forEach(x=>x.remove());
 template.content.querySelectorAll("*").forEach(el=>{
  [...el.attributes].forEach(attr=>{
   if(/^on/i.test(attr.name))el.removeAttribute(attr.name);
   if(["href","src","xlink:href"].includes(attr.name.toLowerCase())&&/^\s*javascript:/i.test(attr.value))el.removeAttribute(attr.name);
  });
 });
 return template.innerHTML;
}
