function head(title,sub,action=''){return '<div class="page-head"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+action+'</div>'}

function meta(){app.innerHTML=head('Meta Ads','Secure server-side API integration area.')+demoRows('Campaign Performance Sample',['Campaign','Spend','Purchases','Revenue','ROAS'],[

function liveLogin(){
 app.innerHTML=head("Secure CMS Login","Sign in with the same Supabase admin account used by the existing admin panel.")+
 '<div class="panel login-card"><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div>'+
 '<div class="field" style="margin-top:12px"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div>'+
 '<div id="loginError" class="live-error"></div><div class="section-actions"><button class="btn primary" onclick="doLogin()">Sign In</button></div>'+
 '<p class="hint">Read-only mirror of real Orders and Finance. Existing admin and website are not modified.</p></div>';
}
async function doLogin(){
 const email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value;
 const {error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error){document.getElementById("loginError").textContent=error.message;return}
 await loadLiveData();
}
async function logoutCMS(){await supabaseClient.auth.signOut();liveData=null;document.getElementById("liveState").textContent="Signed out";liveLogin()}
async function loadLiveData(){
 document.getElementById("liveState").textContent="Loading real admin data…";
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(!session){document.getElementById("liveState").textContent="Login required";liveLogin();return}
 const {data,error}=await supabaseClient.functions.invoke("cms-data");
 if(error){document.getElementById("liveState").textContent="Connection error";app.innerHTML=head("CMS Connection Error","Secure live-data service could not be reached.")+'<div class="panel"><p class="live-error">'+esc(error.message)+'</p><button class="btn" onclick="loadLiveData()">Retry</button></div>';return}
 liveData=data;document.getElementById("liveState").textContent="LIVE • Real Admin Data";render("dashboard");
}
async function orders(){
 if(!liveData)return liveLogin();
 const rows=liveData.orders||[];
 app.innerHTML=head("Orders","LIVE read-only mirror of the real Orders data.","<button class='btn' onclick='loadLiveData()'>Refresh</button>")+
 '<div class="toolbar"><input id="orderSearch" placeholder="Search order, customer, phone, city…" oninput="filterLiveOrders()">'+
 '<select id="orderStatusFilter" onchange="filterLiveOrders()"><option value="">All statuses</option>'+
 [...new Set(rows.map(o=>o.status).filter(Boolean))].sort().map(s=>"<option>"+esc(s)+"</option>").join("")+
 '</select><button class="btn" onclick="logoutCMS()">Sign Out</button></div>'+
 '<div class="panel"><div class="table-wrap"><table class="table live-table"><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>City</th><th>Items</th><th>Sales</th><th>Status</th><th>Tracking</th><th>Date</th></tr></thead><tbody id="liveOrdersBody"></tbody></table></div></div>'+
 '<div class="panel"><p class="hint">'+rows.length+' real orders loaded. No order data is written by this CMS.</p></div>';
 renderLiveOrders(rows);
}
function renderLiveOrders(rows){
 const body=document.getElementById("liveOrdersBody");if(!body)return;
 body.innerHTML=rows.map(o=>{
  const items=Array.isArray(o.items)?o.items.map(i=>i.name||i.product_name||i.title||"Item").join(", "):(o.items||"—");
  return "<tr><td><strong>"+esc(o.order_number)+"</strong></td><td>"+esc(o.full_name)+"</td><td>"+esc(o.phone)+"</td><td>"+esc(o.city)+"</td><td>"+esc(typeof items==="object"?JSON.stringify(items):items)+"</td><td>"+money(o.total)+"</td><td>"+esc(o.status)+"</td><td>"+esc(o.tracking_number||"—")+"</td><td>"+esc(new Date(o.created_at).toLocaleString("en-PK"))+"</td></tr>";
 }).join("")||'<tr><td colspan="9">No matching orders.</td></tr>';
}
function filterLiveOrders(){
 const q=(document.getElementById("orderSearch")?.value||"").toLowerCase(),s=document.getElementById("orderStatusFilter")?.value||"";
 renderLiveOrders((liveData.orders||[]).filter(o=>(!s||o.status===s)&&(!q||[o.order_number,o.full_name,o.phone,o.city,o.address].join(" ").toLowerCase().includes(q))));
}
async function finance(){
 if(!liveData)return liveLogin();
 const o=liveData.orders||[],d=liveData.daily_finance||[];
 const eligible=o.filter(x=>!/^cancelled$/i.test(x.status||""));
 const sales=eligible.filter(x=>!/^delivery failed$/i.test(x.status||"")).reduce((a,x)=>a+Number(x.total||0),0);
 const sum=k=>eligible.reduce((a,x)=>a+Number(x[k]||0),0);
 const product=sum("product_cost"),shipping=sum("shipping_cost"),ads=sum("ads_cost"),packaging=sum("packaging_cost"),returns=sum("return_shipping_cost"),other=sum("other_cost");
 const profit=sales-product-shipping-ads-packaging-returns-other;
 app.innerHTML=head("Finance","LIVE read-only mirror using real order finance fields and daily finance records.","<button class='btn' onclick='loadLiveData()'>Refresh</button>")+
 '<div class="cards"><div class="card"><span>Total Sales</span><strong>'+money(sales)+'</strong></div><div class="card"><span>Product Cost</span><strong>'+money(product)+'</strong></div><div class="card"><span>Delivery Cost</span><strong>'+money(shipping)+'</strong></div><div class="card"><span>Ads Cost</span><strong>'+money(ads)+'</strong></div><div class="card"><span>Packaging</span><strong>'+money(packaging)+'</strong></div><div class="card"><span>Return Shipping</span><strong>'+money(returns)+'</strong></div><div class="card"><span>Other Cost</span><strong>'+money(other)+'</strong></div><div class="card"><span>Live P/L</span><strong>'+money(profit)+'</strong></div></div>'+
 demoRows("Daily Finance — Real Data",["Date","Ads Cost"],d.map(x=>[x.finance_date,money(x.ads_cost)]))+
 '<div class="panel"><h2>Real Order Finance</h2><div class="table-wrap"><table class="table live-table"><tr><th>Order</th><th>Status</th><th>Sales</th><th>Product</th><th>Delivery</th><th>Ads</th><th>Packaging</th><th>Return</th><th>Other</th><th>P/L</th></tr>'+
 eligible.map(x=>{const p=Number(x.total||0)-Number(x.product_cost||0)-Number(x.shipping_cost||0)-Number(x.ads_cost||0)-Number(x.packaging_cost||0)-Number(x.return_shipping_cost||0)-Number(x.other_cost||0);return "<tr><td>"+esc(x.order_number)+"</td><td>"+esc(x.status)+"</td><td>"+money(x.total)+"</td><td>"+money(x.product_cost)+"</td><td>"+money(x.shipping_cost)+"</td><td>"+money(x.ads_cost)+"</td><td>"+money(x.packaging_cost)+"</td><td>"+money(x.return_shipping_cost)+"</td><td>"+money(x.other_cost)+"</td><td>"+money(p)+"</td></tr>"}).join("")+
 '</table></div></div><div class="panel"><p class="hint">Real data is read through a separate secured CMS service. Existing Orders/Finance logic is untouched.</p></div>';
}
function dashboard(){
 if(!liveData)return liveLogin();
 const rows=liveData.orders||[],active=rows.filter(o=>!/cancelled|delivery failed/i.test(o.status||"")),delivered=rows.filter(o=>/delivered/i.test(o.status||""));
 const sales=active.reduce((a,o)=>a+Number(o.total||0),0);
 app.innerHTML=head("CMS Dashboard","Real-time overview from the existing admin database.","<button class='btn' onclick='loadLiveData()'>Refresh</button>")+
 '<div class="cards"><div class="card"><span>Real Orders</span><strong>'+rows.length+'</strong></div><div class="card"><span>Total Sales</span><strong>'+money(sales)+'</strong></div><div class="card"><span>Delivered</span><strong>'+delivered.length+'</strong></div><div class="card"><span>Daily Finance Rows</span><strong>'+(liveData.daily_finance||[]).length+'</strong></div></div>'+
 '<div class="panel"><h2>Live Data</h2><p class="hint">Orders, daily finance, finance settings and existing admin records are loaded live. This CMS does not write to those tables.</p></div>'+
 '<div class="panel"><h2>CMS Content Modules</h2><p class="hint">Products, categories, homepage, banners, blog, SEO, promotions, media, FAQs and settings remain isolated demo modules until we connect their actual website content.</p></div>';
}

loadLiveData();
