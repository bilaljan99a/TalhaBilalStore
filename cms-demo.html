<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Talha Bilal Store — CMS Demo</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#17191d;--muted:#70757d;--line:#e5e7eb;--accent:#ff6a00;--nav:#15171b;--success:#18864b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.layout{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:var(--nav);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:800;padding:0 10px 26px}.brand small{display:block;color:#969ba4;font-size:11px;font-weight:500;margin-top:4px}.nav button{display:block;width:100%;border:0;background:transparent;color:#c9ccd1;text-align:left;padding:11px 12px;border-radius:9px;margin:3px 0}.nav button:hover,.nav button.active{background:#282b31;color:#fff}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.demo-badge{font-size:12px;font-weight:700;color:#9a4d00;background:#fff1e7;padding:7px 10px;border-radius:999px}.content{padding:28px;max-width:1400px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.page-head h1{font-size:25px;margin:0 0 5px}.page-head p{margin:0;color:var(--muted);font-size:14px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 14px;font-weight:650}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.card{padding:18px}.card span{display:block;color:var(--muted);font-size:12px}.card strong{font-size:23px;display:block;margin-top:8px}.panel{padding:20px;margin-top:18px}.panel h2{font-size:17px;margin:0 0 15px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef8f1;color:var(--success);font-size:11px;font-weight:700}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d9dce1;border-radius:8px;padding:10px 11px;background:#fff}.field textarea{min-height:105px;resize:vertical}.section-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hint{font-size:12px;color:var(--muted);margin-top:6px}.item-list{display:grid;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:15px;border:1px solid var(--line);padding:14px;border-radius:9px}.item strong{font-size:14px}.item small{display:block;color:var(--muted);margin-top:3px}.item-actions{display:flex;gap:7px}.danger{color:#b42318}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:12px}.brand{padding:8px 10px}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;width:auto}.cards{grid-template-columns:1fr 1fr}}@media(max-width:600px){.content{padding:18px}.topbar{padding:0 18px}.cards,.form-grid{grid-template-columns:1fr}.page-head{flex-direction:column}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="brand">Talha Bilal Store<small>Custom CMS • SAFE PREVIEW</small></div>
<nav class="nav" id="nav">
<button data-page="dashboard" class="active">Dashboard</button>
<button data-page="products">Products</button>
<button data-page="pages">Website Content</button>
<button data-page="blog">Blog</button>
<button data-page="reviews">Reviews</button>
<button data-page="faqs">FAQs</button>
<button data-page="seo">SEO</button>
<button data-page="settings">Settings</button><button data-page="orders">Orders</button><button data-page="finance">Finance</button><button data-page="promotions">Deals & Promotions</button><button data-page="meta">Meta Ads</button><button data-page="media">Media Library</button><button data-page="homepage">Homepage Builder</button><button data-page="banners">Banners / Slider</button><button data-page="categories">Categories</button><button data-page="attributes">Product Attributes</button><button data-page="audit">Change History</button>
</nav>
</aside>
<main class="main">
<header class="topbar"><strong id="crumb">Dashboard</strong><span class="demo-badge">DEMO ONLY — Existing Admin Untouched</span></header>
<div class="content" id="app"></div>
</main>
</div>
<script>
const seed={
products:[{name:'Mango Premix Drink — 1kg',price:'450',status:'Active'},{name:'Mango Premix Drink — 2kg',price:'800',status:'Active'},{name:'Mango Premix Drink — 5kg',price:'1850',status:'Active'}],
pages:[{name:'Homepage',sections:'Hero • Featured Products • Reviews • FAQ • CTA'},{name:'Why Us',sections:'Quality • 60% Mango Pulp • Easy Ordering'},{name:'How to Order',sections:'Order Steps • COD • Delivery'}],
blog:[{title:'How to Make Mango Drink from Mango Pulp Premix',status:'Published'},{title:'Where to Buy Mango Pulp in Pakistan',status:'Published'}],
reviews:[{name:'Sample Customer',rating:'5',text:'Excellent taste and quality.'}],
faqs:[{q:'How do I place an order?',a:'Choose a product and complete the COD form.'},{q:'Do you deliver across Pakistan?',a:'Yes, delivery is available across Pakistan.'}],
seo:{homeTitle:'Talha Bilal Store | Mango Pulp Drink Premix',homeMeta:'Shop Mango Pulp Drink Premix in 1kg to 10kg packs with Cash on Delivery across Pakistan.'},
settings:{store:'Talha Bilal Store',whatsapp:'0311 9167630',announcement:'Cash on Delivery — All Over Pakistan'}
};
function load(){try{return JSON.parse(localStorage.getItem('tbsCmsDemo'))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
let db=load();function save(){localStorage.setItem('tbsCmsDemo',JSON.stringify(db))}
const app=document.getElementById('app'),crumb=document.getElementById('crumb');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function head(title,sub,action=''){return '<div class="page-head"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+action+'</div>'}
function render(page='dashboard'){
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));crumb.textContent=page==='dashboard'?'Dashboard':page.replace(/^./,x=>x.toUpperCase());
if(page==='dashboard')return dashboard();
if(page==='products')return products();
if(page==='pages')return pages();
if(page==='blog')return blog();
if(page==='reviews')return reviews();
if(page==='faqs')return faqs();
if(page==='seo')return seo();
if(page==='settings')return settings();
if(page==='orders')return orders();
if(page==='finance')return finance();
if(page==='promotions')return promotions();
if(page==='meta')return meta();
if(page==='media')return media();
if(page==='homepage')return homepage();
if(page==='banners')return banners();
if(page==='categories')return categories();
if(page==='attributes')return attributes();
if(page==='audit')return audit();
}

async function orders(){app.innerHTML=head('Orders','Read-only preview of the existing order system. No order editing is enabled here.')+'<div class="panel"><h2>Safety</h2><p class="hint">The production Orders/Finance admin remains untouched. The final CMS can mirror these records through secured read access and later add approved workflows.</p></div><div class="panel"><div class="table-wrap"><table class="table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr><tr><td>Live data connection planned</td><td>Existing orders</td><td>Read-only</td><td>Protected</td></tr></table></div></div>'}
async function finance(){app.innerHTML=head('Finance','Read-only preview of the existing finance system.')+'<div class="cards"><div class="card"><span>Product Cost</span><strong>Existing Formula</strong></div><div class="card"><span>Delivery Cost</span><strong>Existing Formula</strong></div><div class="card"><span>Ads Cost / Share</span><strong>Existing Formula</strong></div><div class="card"><span>ROI / P&L</span><strong>Existing Formula</strong></div></div><div class="panel"><p class="hint">All current finance formulas, pagination, monthly P/L, failed-return loss, ROI and ads allocation stay in the current admin until the CMS replacement is fully tested.</p></div>'}
function promotions(){app.innerHTML=head('Deals & Promotions','Conversion tools with real start/end dates and customer-facing countdowns.','<button class="btn primary" onclick="alert(\'Demo: promotion editor\')">+ New Promotion</button>')+'<div class="cards"><div class="card"><span>Percentage / Fixed</span><strong>Ready</strong></div><div class="card"><span>Bundles</span><strong>Ready</strong></div><div class="card"><span>Free Shipping</span><strong>Ready</strong></div><div class="card"><span>Countdown</span><strong>Real expiry</strong></div></div><div class="panel"><h2>Conversion toolkit</h2><p>Limited-time offers, bundles, quantity discounts, free-shipping thresholds, best-seller/new badges, honest low-stock messaging, social proof, sticky mobile CTA, WhatsApp CTA, delivery estimates and related products.</p></div>'}
function meta(){app.innerHTML=head('Meta Ads','Secure server-side API integration area.')+'<div class="cards"><div class="card"><span>Ad Accounts</span><strong>Planned</strong></div><div class="card"><span>Campaigns</span><strong>Planned</strong></div><div class="card"><span>Spend</span><strong>Planned</strong></div><div class="card"><span>ROAS</span><strong>Planned</strong></div></div><div class="panel"><h2>Important</h2><p class="hint">Meta access tokens must never be stored in browser code. The final integration will use a server-side function and then connect spend → orders → sales → profit/ROI.</p></div>'}
function media(){app.innerHTML=head('Media Library','Reusable product images, banners, blog media, logos and video assets.','<button class="btn primary" onclick="alert(\'Demo media uploader\')">+ Add Media</button>')+'<div class="panel"><div class="item-list"><div class="item"><div><strong>Product Images</strong><small>Upload, replace, reorder, alt text and reuse.</small></div><span class="status">Ready</span></div><div class="item"><div><strong>Homepage Creative</strong><small>Desktop + mobile banner assets.</small></div><span class="status">Ready</span></div><div class="item"><div><strong>Blog / SEO Media</strong><small>Featured images and social/OG assets.</small></div><span class="status">Ready</span></div></div></div>'}
function homepage(){app.innerHTML=head('Homepage Builder','Visual section management without editing HTML.','<button class="btn primary" onclick="alert(\'Demo section editor\')">+ Add Section</button>')+'<div class="panel"><div class="item-list">'+['Announcement Bar','Hero / Slider','Featured Products','Best Sellers','Promotion Banner','Why Choose Us','Reviews / Social Proof','FAQ','Blog','Trust / COD','CTA / WhatsApp','Footer'].map((x,i)=>'<div class="item"><div><strong>'+x+'</strong><small>Show / hide • reorder • duplicate • desktop/mobile settings</small></div><span class="status">'+(i<3?'Active':'Ready')+'</span></div>').join('')+'</div></div>'}
function banners(){app.innerHTML=head('Banners / Slider','Schedule creative with desktop/mobile images, CTA and start/end dates.','<button class="btn primary" onclick="alert(\'Demo banner editor\')">+ Add Banner</button>')+'<div class="panel"><p class="hint">Supports homepage hero, promotional banners, slider ordering, mobile-specific creative and real campaign scheduling.</p></div>'}
function categories(){app.innerHTML=head('Categories','Create parent categories and subcategories with images, SEO and sorting.','<button class="btn primary" onclick="alert(\'Demo category editor\')">+ Add Category</button>')+'<div class="panel"><div class="item-list"><div class="item"><div><strong>Parent / Subcategory</strong><small>Drag/sort • active/inactive • SEO</small></div><span class="status">Ready</span></div></div></div>'}
function attributes(){app.innerHTML=head('Product Attributes','Optional attributes can be enabled only when relevant.')+'<div class="cards"><div class="card"><span>Mango</span><strong>Weight</strong></div><div class="card"><span>Clothing</span><strong>Size + Color</strong></div><div class="card"><span>Electronics</span><strong>Storage + Color</strong></div><div class="card"><span>Custom</span><strong>Any Attribute</strong></div></div><div class="panel"><p class="hint">No irrelevant fields are forced on products. Attribute definitions are stored per product/variant.</p></div>'}
function audit(){app.innerHTML=head('Change History','Future CMS writes will record user, time, action and before/after values.')+'<div class="panel"><p class="hint">Audit log foundation is included in the new CMS database. Existing admin history is not modified.</p></div>'}

function dashboard(){app.innerHTML=head('CMS Dashboard','A safe demo of the future content management system.')+'<div class="cards"><div class="card"><span>Products</span><strong>'+db.products.length+'</strong></div><div class="card"><span>Website Pages</span><strong>'+db.pages.length+'</strong></div><div class="card"><span>Blog Posts</span><strong>'+db.blog.length+'</strong></div><div class="card"><span>Reviews</span><strong>'+db.reviews.length+'</strong></div></div><div class="panel"><h2>What this demo proves</h2><p class="hint">This separate CMS can eventually control website content without touching the existing Orders / Finance admin. Right now all demo edits stay inside this browser using local storage. No production Supabase data is changed.</p></div>'}
function products(){app.innerHTML=head('Products','Manage names, prices, descriptions, images, pack sizes and SEO in the future.','<button class="btn primary" onclick="addProduct()">+ Add Product</button>')+'<div class="panel"><div class="item-list">'+db.products.map((p,i)=>'<div class="item"><div><strong>'+esc(p.name)+'</strong><small>Rs. '+esc(p.price)+' • '+esc(p.status)+'</small></div><div class="item-actions"><button class="btn" onclick="editProduct('+i+')">Edit</button><button class="btn danger" onclick="removeItem(\'products\','+i+')">Delete</button></div></div>').join('')+'</div></div>'}
function addProduct(){db.products.push({name:'New Product',price:'0',status:'Active'});save();render('products');editProduct(db.products.length-1)}
function editProduct(i){const p=db.products[i];app.innerHTML=head('Edit Product','Demo editor — changes are local to this demo.')+'<div class="panel"><div class="form-grid"><div class="field full"><label>Product Name</label><input id="pn" value="'+esc(p.name)+'"></div><div class="field"><label>Price</label><input id="pp" value="'+esc(p.price)+'"></div><div class="field"><label>Status</label><select id="ps"><option '+(p.status==='Active'?'selected':'')+'>Active</option><option '+(p.status==='Draft'?'selected':'')+'>Draft</option></select></div></div><div class="section-actions"><button class="btn" onclick="render('products')">Cancel</button><button class="btn primary" onclick="saveProduct('+i+')">Save Product</button></div></div>'}
function saveProduct(i){db.products[i].name=document.getElementById('pn').value;db.products[i].price=document.getElementById('pp').value;db.products[i].status=document.getElementById('ps').value;save();render('products')}
function pages(){app.innerHTML=head('Website Content','Control homepage and static-page sections from one place.','<button class="btn primary" onclick="addPage()">+ Add Page</button>')+'<div class="panel"><div class="item-list">'+db.pages.map((p,i)=>'<div class="item"><div><strong>'+esc(p.name)+'</strong><small>'+esc(p.sections)+'</small></div><div class="item-actions"><button class="btn" onclick="editPage('+i+')">Edit</button><button class="btn danger" onclick="removeItem(\'pages\','+i+')">Delete</button></div></div>').join('')+'</div></div>'}
function addPage(){db.pages.push({name:'New Page',sections:'New Section'});save();render('pages')}
function editPage(i){const p=db.pages[i];app.innerHTML=head('Edit Page','In the final CMS this becomes a section editor with show/hide and reorder controls.')+'<div class="panel"><div class="form-grid"><div class="field"><label>Page Name</label><input id="pg" value="'+esc(p.name)+'"></div><div class="field"><label>Sections</label><input id="psx" value="'+esc(p.sections)+'"></div></div><div class="section-actions"><button class="btn" onclick="render('pages')">Cancel</button><button class="btn primary" onclick="db.pages['+i+'].name=document.getElementById(\'pg\').value;db.pages['+i+'].sections=document.getElementById(\'psx\').value;save();render(\'pages\')">Save Page</button></div></div>'}
function blog(){app.innerHTML=head('Blog','Create, edit, draft and publish articles with SEO fields.','<button class="btn primary" onclick="addBlog()">+ New Post</button>')+'<div class="panel"><div class="item-list">'+db.blog.map((p,i)=>'<div class="item"><div><strong>'+esc(p.title)+'</strong><small>'+esc(p.status)+'</small></div><div class="item-actions"><button class="btn" onclick="editBlog('+i+')">Edit</button><button class="btn danger" onclick="removeItem(\'blog\','+i+')">Delete</button></div></div>').join('')+'</div></div>'}
function addBlog(){db.blog.push({title:'New Blog Post',status:'Draft'});save();render('blog')}
function editBlog(i){const p=db.blog[i];app.innerHTML=head('Edit Blog Post','Final version will include editor, featured image, slug and SEO.')+'<div class="panel"><div class="form-grid"><div class="field full"><label>Title</label><input id="bt" value="'+esc(p.title)+'"></div><div class="field"><label>Status</label><select id="bs"><option '+(p.status==='Published'?'selected':'')+'>Published</option><option '+(p.status==='Draft'?'selected':'')+'>Draft</option></select></div></div><div class="section-actions"><button class="btn" onclick="render('blog')">Cancel</button><button class="btn primary" onclick="db.blog['+i+'].title=document.getElementById(\'bt\').value;db.blog['+i+'].status=document.getElementById(\'bs\').value;save();render(\'blog\')">Save Post</button></div></div>'}
function reviews(){app.innerHTML=head('Reviews','Manage customer reviews and approval status.','<button class="btn primary" onclick="addReview()">+ Add Review</button>')+'<div class="panel"><div class="item-list">'+db.reviews.map((r,i)=>'<div class="item"><div><strong>'+esc(r.name)+' • '+esc(r.rating)+'/5</strong><small>'+esc(r.text)+'</small></div><button class="btn danger" onclick="removeItem(\'reviews\','+i+')">Delete</button></div>').join('')+'</div></div>'}
function addReview(){db.reviews.push({name:'Customer',rating:'5',text:'New review'});save();render('reviews')}
function faqs(){app.innerHTML=head('FAQs','Manage questions and answers shown across the website.','<button class="btn primary" onclick="addFaq()">+ Add FAQ</button>')+'<div class="panel"><div class="item-list">'+db.faqs.map((f,i)=>'<div class="item"><div><strong>'+esc(f.q)+'</strong><small>'+esc(f.a)+'</small></div><button class="btn danger" onclick="removeItem(\'faqs\','+i+')">Delete</button></div>').join('')+'</div></div>'}
function addFaq(){db.faqs.push({q:'New Question',a:'New Answer'});save();render('faqs')}
function seo(){app.innerHTML=head('SEO Manager','Central place for page titles, meta descriptions and indexing controls.')+'<div class="panel"><div class="form-grid"><div class="field full"><label>Homepage SEO Title</label><input id="st" value="'+esc(db.seo.homeTitle)+'"></div><div class="field full"><label>Homepage Meta Description</label><textarea id="sm">'+esc(db.seo.homeMeta)+'</textarea></div><div class="field"><label>Indexing</label><select><option>Index, Follow</option><option>Noindex, Follow</option></select></div><div class="field"><label>Canonical</label><input placeholder="https://www.talhabilalstore.com/"></div></div><div class="section-actions"><button class="btn primary" onclick="db.seo.homeTitle=document.getElementById('st').value;db.seo.homeMeta=document.getElementById('sm').value;save();alert('Demo SEO settings saved.')">Save SEO</button></div></div>'}
function settings(){app.innerHTML=head('Website Settings','Store-wide information used by the website.')+'<div class="panel"><div class="form-grid"><div class="field"><label>Store Name</label><input id="sn" value="'+esc(db.settings.store)+'"></div><div class="field"><label>WhatsApp</label><input id="sw" value="'+esc(db.settings.whatsapp)+'"></div><div class="field full"><label>Announcement Bar</label><input id="sa" value="'+esc(db.settings.announcement)+'"></div></div><div class="section-actions"><button class="btn primary" onclick="db.settings.store=document.getElementById('sn').value;db.settings.whatsapp=document.getElementById('sw').value;db.settings.announcement=document.getElementById('sa').value;save();alert('Demo settings saved.')">Save Settings</button></div></div>'}
function removeItem(type,i){if(confirm('Delete this demo item?')){db[type].splice(i,1);save();render(type==='products'?'products':type)}}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)render(b.dataset.page)});
render();
</script>
</body>
</html>
