<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | Talha Bilal Store</title><link rel="icon" href="assets/TalhaBilalStore%20Logo.jpg"><link rel="stylesheet" href="styles.css?v=20260901-3"><link rel="stylesheet" href="pages.css?v=20260901-3"><style>.account-page{padding:42px 0 80px}.account-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:25px}.account-card,.order-card{background:#fff;border:1px solid #e7e7e7;border-radius:18px;padding:22px}.order-card{margin-top:15px}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.order-number{font-weight:900}.status{display:inline-block;padding:6px 10px;border-radius:99px;background:#f3f3f3;font-weight:800;font-size:13px}.status.delivered{background:#e7f7ed}.order-items{margin:16px 0;padding-left:20px;line-height:1.8}.order-total{font-weight:900}.review-list{display:grid;gap:10px;margin-top:14px}.review-item{padding:14px;background:#fafafa;border-radius:12px}.review-btn{border:0;background:#ff6a00;color:#fff;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.review-form{margin-top:15px;padding:18px;background:#fff8f2;border-radius:14px;display:grid;gap:12px}.review-form label{display:grid;gap:6px;font-weight:700}.review-form input,.review-form textarea,.review-form select{padding:11px;border:1px solid #ddd;border-radius:8px;font:inherit}.stars{font-size:20px}.logout-btn{border:1px solid #ddd;background:#fff;padding:10px 15px;border-radius:8px;font-weight:800;cursor:pointer}.empty{padding:30px;text-align:center;color:var(--muted)}.account-note{color:var(--muted);font-size:14px}</style></head><body><div class="announcement">🚚 Cash on Delivery • 🔐 My Account • ⭐ Review delivered products</div><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img src="assets/TalhaBilalStore%20Logo.jpg" alt="Talha Bilal Store"></a><nav class="desktop-nav"><a href="index.html">Home</a><a href="products.html">All Products</a><a href="track-order.html">Track Order</a></nav><button class="cart-button" id="logout" type="button">Logout</button></div></header><main class="account-page"><div class="container"><div class="account-head"><div><span class="eyebrow">MY ACCOUNT</span><h1 id="welcome">My Orders</h1><p class="account-note">Only orders connected to your account are shown here.</p></div></div><div id="orders"><div class="account-card">Loading your orders…</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const ordersEl=document.getElementById('orders');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function itemList(items){if(!Array.isArray(items))return '<li>Order items</li>';return items.map(i=>`<li>${esc(i.name||'Product')} × ${Number(i.quantity||1)}</li>`).join('')}function reviewForm(order,item,index){const key=`review-${order.id}-${index}`;return `<form class="review-form" id="${key}" data-order="${esc(order.order_number)}" data-product="${esc(item.name||'Product')}"><strong>Review: ${esc(item.name||'Product')}</strong><label>Rating<select name="rating" required><option value="5">★★★★★ — Excellent</option><option value="4">★★★★ — Very Good</option><option value="3">★★★ — Good</option><option value="2">★★ — Okay</option><option value="1">★ — Poor</option></select></label><label>Your Review<textarea name="review_text" rows="3" minlength="5" maxlength="1000" required placeholder="Tell us about your experience..."></textarea></label><button class="review-btn" type="submit">Submit Review</button><span class="account-note">Your review is linked to this delivered order.</span></form>`}function render(orders){if(!orders.length){ordersEl.innerHTML='<div class="account-card empty">No orders are linked to this account yet.<br>Place an order while logged in, or make sure the mobile number on your account matches the order.</div>';return}ordersEl.innerHTML=orders.map(o=>{const delivered=String(o.status||'').toLowerCase()==='delivered';const items=Array.isArray(o.items)?o.items:[];return `<article class="order-card"><div class="order-head"><div><div class="order-number">Order #${esc(o.order_number)}</div><small>${tbFormatDate(o.created_at)}</small></div><span class="status ${delivered?'delivered':''}">${esc(o.status)}</span></div><ul class="order-items">${itemList(items)}</ul><div class="order-total">Total: Rs. ${Number(o.total||0).toLocaleString('en-PK')}</div>${o.tracking_number?`<p><strong>Tracking:</strong> ${esc(o.tracking_number)} · <a href="https://www.dex.com.pk/tracking?references=${encodeURIComponent(o.tracking_number)}" target="_blank" rel="noopener">Track Parcel on DEX →</a></p>`:''}${delivered?`<div class="review-list">${items.map((item,i)=>reviewForm(o,item,i)).join('')}</div>`:'<p class="account-note">Review option will appear here after this order is marked Delivered.</p>'}</article>`}).join('');document.querySelectorAll('.review-form').forEach(form=>form.addEventListener('submit',submitReview))}async function submitReview(e){e.preventDefault();const form=e.currentTarget;const session=await tbSession();if(!session){location.href='login.html';return}const button=form.querySelector('button');button.disabled=true;button.textContent='Submitting…';const fd=new FormData(form);try{const res=await fetch(TB_REVIEW_FUNCTION,{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,apikey:TB_SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({order_number:form.dataset.order,product_name:form.dataset.product,rating:Number(fd.get('rating')),review_text:String(fd.get('review_text')||'').trim(),customer_name:session.user.user_metadata?.full_name||'Customer'})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.success)throw new Error(data.error||'Review could not be submitted.');form.innerHTML='<strong>⭐ Thank you! Your review has been submitted.</strong>'}catch(err){alert(err.message||'Review could not be submitted.');button.disabled=false;button.textContent='Submit Review'}}(async()=>{const session=await tbRequireLogin();if(!session)return;document.getElementById('welcome').textContent=`Hello, ${session.user.user_metadata?.full_name||'Customer'}`;document.getElementById('logout').onclick=tbLogout;try{const orders=await tbAccountOrders(session);render(orders)}catch(err){ordersEl.innerHTML=`<div class="account-card">${esc(err.message||'Could not load orders.')}</div>`}})();</script></body></html>
