<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Orders | Talha Bilal Store</title><link rel="icon" href="assets/TalhaBilalStore%20Logo.jpg"><link rel="stylesheet" href="styles.css?v=20260901-3"><style>body{background:#f7f7f7}.admin-wrap{max-width:1250px;margin:0 auto;padding:32px 18px 60px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.admin-head h1{margin:0}.login-card,.orders-card{background:#fff;border:1px solid #e8e8e8;border-radius:18px;padding:24px;box-shadow:0 8px 30px #00000008}.login-card{max-width:430px;margin:70px auto}.field{margin-bottom:15px}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px}.btn{border:0;border-radius:10px;padding:12px 17px;font-weight:700;cursor:pointer}.primary{background:#ff6a00;color:#fff}.muted{background:#eee}.error{color:#c62828;margin-top:10px}.table-wrap{overflow:auto}.orders-table{width:100%;border-collapse:collapse;min-width:1080px}.orders-table th,.orders-table td{padding:14px 10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.orders-table th{font-size:13px;text-transform:uppercase}.status{padding:8px 9px;border-radius:10px;border:1px solid #ddd;background:#fafafa;min-width:130px}.tracking-input{width:145px;box-sizing:border-box;padding:8px;border:1px solid #ddd;border-radius:9px;margin-top:7px}.save-track{margin-top:7px;padding:7px 10px;border:0;border-radius:8px;background:#111;color:#fff;font-size:12px;font-weight:700;cursor:pointer}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.stat{background:#fff;border:1px solid #eee;border-radius:14px;padding:14px 18px;min-width:120px}.stat strong{display:block;font-size:22px}.hidden{display:none!important}.order-items{font-size:13px;line-height:1.5}.top-actions{display:flex;gap:8px}.saved{font-size:11px;color:#16803c;margin-left:5px}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img src="assets/TalhaBilalStore%20Logo.jpg" alt="Talha Bilal Store"></a><div class="top-actions"><a class="btn muted" href="index.html">Store</a><button id="logoutBtn" class="btn muted hidden">Logout</button></div></div></header><main class="admin-wrap"><section id="loginCard" class="login-card"><h1>Admin Orders</h1><p>Sign in to view and manage store orders.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="Admin email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password" placeholder="Password"></div><button class="btn primary" type="submit">Sign In</button><div id="loginError" class="error"></div></form></section><section id="dashboard" class="hidden"><div class="admin-head"><div><h1>Orders Dashboard</h1><p>View new COD orders, update status and add courier tracking numbers.</p></div></div><div class="stats"><div class="stat"><small>Total Orders</small><strong id="totalCount">0</strong></div><div class="stat"><small>New</small><strong id="newCount">0</strong></div><div class="stat"><small>Confirmed</small><strong id="confirmedCount">0</strong></div><div class="stat"><small>Delivered</small><strong id="deliveredCount">0</strong></div></div><div class="orders-card"><div class="admin-head"><h2>Recent Orders</h2><button id="refreshBtn" class="btn muted">Refresh</button></div><div id="loadError" class="error"></div><div class="table-wrap"><table class="orders-table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Date</th><th>Status</th><th>Courier Tracking</th></tr></thead><tbody id="ordersBody"></tbody></table></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script>const SUPABASE_URL='https://dxdjqeqlmyawqrzphzdb.supabase.co',SUPABASE_KEY='sb_publishable__VZebPfljfwPNTxcWbDD7Q_pzIJvn_K',ADMIN_FUNCTION=SUPABASE_URL+'/functions/v1/admin-orders',supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const loginCard=document.getElementById('loginCard'),dashboard=document.getElementById('dashboard'),loginForm=document.getElementById('loginForm'),loginError=document.getElementById('loginError'),loadError=document.getElementById('loadError'),body=document.getElementById('ordersBody');function money(n){return 'Rs. '+Number(n).toLocaleString('en-PK')}async function api(path='',options={}){const{data:{session}}=await supabase.auth.getSession();if(!session)throw new Error('Please sign in again.');const r=await fetch(ADMIN_FUNCTION+path,{...options,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(options.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed.');return j}function showDashboard(){loginCard.classList.add('hidden');dashboard.classList.remove('hidden');document.getElementById('logoutBtn').classList.remove('hidden');loadOrders()}async function loadOrders(){loadError.textContent='';try{const{orders=[]}=await api();document.getElementById('totalCount').textContent=orders.length;document.getElementById('newCount').textContent=orders.filter(o=>o.status==='New').length;document.getElementById('confirmedCount').textContent=orders.filter(o=>o.status==='Confirmed').length;document.getElementById('deliveredCount').textContent=orders.filter(o=>o.status==='Delivered').length;if(!orders.length){body.innerHTML='<tr><td colspan="7">No orders yet.</td></tr>';return}body.innerHTML=orders.map(o=>{const items=(o.items||[]).map(i=>`${i.name} × ${i.quantity}`).join('<br>');return `<tr><td><strong>${o.order_number}</strong><br><small>${o.payment_method||'Cash on Delivery'}</small></td><td><strong>${o.full_name}</strong><br>${o.phone}<br>${o.address}<br>${o.city}</td><td class="order-items">${items}</td><td><strong>${money(o.total)}</strong><br><small>Products: ${money(o.product_total)}<br>Delivery: ${money(o.delivery_fee)}</small></td><td>${new Date(o.created_at).toLocaleString('en-PK')}</td><td><select class="status" data-status-id="${o.id}">${['New','Confirmed','Processing','Shipped','Out for Delivery','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td><div>${o.tracking_number?`<strong>${o.tracking_number}</strong>`:'<small>Not added</small>'}</div><input class="tracking-input" data-track-input="${o.id}" value="${String(o.tracking_number||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" placeholder="Dex tracking no."><br><button class="save-track" data-save-track="${o.id}" type="button">Save Tracking</button><span class="saved" id="saved-${o.id}"></span></td></tr>`}).join('');document.querySelectorAll('[data-status-id]').forEach(s=>s.addEventListener('change',async e=>{try{await api('',{method:'PATCH',body:JSON.stringify({id:e.target.dataset.statusId,status:e.target.value})});await loadOrders()}catch(err){alert(err.message)}}));document.querySelectorAll('[data-save-track]').forEach(b=>b.addEventListener('click',async e=>{const id=e.target.dataset.saveTrack,input=document.querySelector(`[data-track-input="${id}"]`);try{await api('',{method:'PATCH',body:JSON.stringify({id,tracking_number:input.value.trim()})});document.getElementById(`saved-${id}`).textContent='Saved';await loadOrders()}catch(err){alert(err.message)}}))}catch(e){loadError.textContent=e.message}}loginForm.addEventListener('submit',async e=>{e.preventDefault();loginError.textContent='';const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const{data,error}=await supabase.auth.signInWithPassword({email,password});if(error){loginError.textContent='Login failed: '+error.message;return}if(!data.session){loginError.textContent='Login failed: no session returned.';return}showDashboard()});document.getElementById('logoutBtn').addEventListener('click',async()=>{await supabase.auth.signOut();location.reload()});document.getElementById('refreshBtn').addEventListener('click',loadOrders);supabase.auth.getSession().then(({data})=>{if(data.session)showDashboard()});</script></body></html>
