<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login / Create Account | Talha Bilal Store</title><link rel="icon" href="assets/TalhaBilalStore%20Logo.jpg"><link rel="stylesheet" href="styles.css?v=20260901-3"><link rel="stylesheet" href="pages.css?v=20260901-3"><style>.auth-page{padding:55px 0 80px}.auth-card{max-width:520px;margin:auto;background:#fff;border:1px solid #e7e7e7;border-radius:20px;padding:30px}.auth-card h1{margin:8px 0 10px}.auth-card p{color:var(--muted)}.auth-tabs{display:flex;gap:8px;margin:22px 0}.auth-tabs button{flex:1;padding:12px;border:1px solid #ddd;background:#fff;border-radius:9px;font-weight:800;cursor:pointer}.auth-tabs button.active{background:#ff6a00;color:#fff;border-color:#ff6a00}.auth-form{display:grid;gap:15px}.auth-form label{display:grid;gap:7px;font-weight:700}.auth-form input{padding:13px;border:1px solid #ddd;border-radius:9px;font:inherit}.auth-btn{border:0;background:#ff6a00;color:#fff;padding:14px;border-radius:9px;font-weight:800;cursor:pointer}.auth-message{padding:12px;border-radius:9px;background:#f7f7f7;margin-top:14px}.small-note{font-size:13px}.account-link{display:block;text-align:center;margin-top:18px}</style></head><body><div class="announcement">🚚 Cash on Delivery • 📦 Quality Products • 🔐 Secure Customer Account</div><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img src="assets/TalhaBilalStore%20Logo.jpg" alt="Talha Bilal Store"></a><nav class="desktop-nav"><a href="index.html">Home</a><a href="products.html">All Products</a><a href="track-order.html">Track Order</a><a href="account.html">My Account</a></nav><a class="cart-button" href="index.html">🛒 Shop</a></div></header><main class="auth-page"><div class="container"><div class="auth-card"><span class="eyebrow">CUSTOMER ACCOUNT</span><h1 id="title">Login to your account</h1><p id="intro">Login with your email address or mobile number to view your orders.</p><div class="auth-tabs"><button id="loginTab" class="active" type="button">Login</button><button id="signupTab" type="button">Create Account</button></div><form id="loginForm" class="auth-form"><label>Email or Mobile Number<input id="loginId" required autocomplete="username" placeholder="Email or 03XX XXXXXXX"></label><label>Password<input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Your password"></label><button class="auth-btn" type="submit">Login</button></form><form id="signupForm" class="auth-form" hidden><label>Full Name<input id="signupName" required autocomplete="name"></label><label>Mobile Number<input id="signupPhone" type="tel" required autocomplete="tel" placeholder="03XX XXXXXXX"></label><label>Email Address<input id="signupEmail" type="email" required autocomplete="email"></label><label>Password<input id="signupPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label><button class="auth-btn" type="submit">Create Account</button></form><div id="message" class="auth-message" hidden></div><a class="account-link" href="index.html">← Continue Shopping</a></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab'),loginForm=document.getElementById('loginForm'),signupForm=document.getElementById('signupForm'),title=document.getElementById('title'),intro=document.getElementById('intro'),message=document.getElementById('message');function showMessage(t){message.hidden=false;message.textContent=t}function tab(signup){loginTab.classList.toggle('active',!signup);signupTab.classList.toggle('active',signup);loginForm.hidden=signup;signupForm.hidden=!signup;title.textContent=signup?'Create your account':'Login to your account';intro.textContent=signup?'Create an account to keep your orders and reviews together.':'Login with your email address or mobile number to view your orders.';message.hidden=true}loginTab.onclick=()=>tab(false);signupTab.onclick=()=>tab(true);(async()=>{if(await tbSession())location.href='account.html';})();loginForm.onsubmit=async e=>{e.preventDefault();const identifier=document.getElementById('loginId').value.trim(),password=document.getElementById('loginPassword').value;showMessage('Logging in…');try{if(identifier.includes('@')){const {error}=await tbSupabase.auth.signInWithPassword({email:identifier,password});if(error)throw error}else{const res=await fetch(`${TB_SUPABASE_URL}/functions/v1/login-by-phone`,{method:'POST',headers:{apikey:TB_SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({phone:identifier,password})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.success)throw new Error(data.error||'Login failed.');const {error}=await tbSupabase.auth.setSession({access_token:data.session.access_token,refresh_token:data.session.refresh_token});if(error)throw error}const r=new URLSearchParams(location.search).get('return');location.href=r||'account.html'}catch(err){showMessage(err.message||'Login failed.')}};signupForm.onsubmit=async e=>{e.preventDefault();const name=document.getElementById('signupName').value.trim(),phone=document.getElementById('signupPhone').value.trim(),email=document.getElementById('signupEmail').value.trim(),password=document.getElementById('signupPassword').value;showMessage('Creating account…');try{const {data,error}=await tbSupabase.auth.signUp({email,password,options:{data:{full_name:name,phone}}});if(error)throw error;if(data.session){location.href='account.html'}else showMessage('Account created. If email confirmation is enabled, please confirm your email and then login.')}catch(err){showMessage(err.message||'Could not create account.')}};</script></body></html>
