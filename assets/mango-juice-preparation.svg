<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">How to prepare mango juice</title>
<desc id="desc">Mango pulp, water and sugar blended together to make mango juice.</desc>
<rect width="1200" height="800" rx="42" fill="#fff8f2"/>
<text x="600" y="92" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="800" fill="#171717">How to Prepare Mango Juice</text>
<text x="600" y="138" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#777">1 kg mango pulp • 7 L water • 600 g sugar</text>
<g transform="translate(90 215)">
  <circle cx="120" cy="100" r="76" fill="#ff6a00"/><text x="120" y="112" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="white">01</text>
  <text x="120" y="230" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#171717">Add ingredients</text>
  <text x="120" y="268" text-anchor="middle" font-family="Arial" font-size="20" fill="#666">Pulp + water + sugar</text>
</g>
<path d="M295 315 H365" stroke="#ff6a00" stroke-width="10" stroke-linecap="round"/><path d="M355 294 L385 315 L355 336" fill="none" stroke="#ff6a00" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(400 215)">
  <circle cx="120" cy="100" r="76" fill="#171717"/><text x="120" y="112" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="white">02</text>
  <text x="120" y="230" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#171717">Blend well</text>
  <text x="120" y="268" text-anchor="middle" font-family="Arial" font-size="20" fill="#666">Use a juicer or blender</text>
</g>
<path d="M605 315 H675" stroke="#ff6a00" stroke-width="10" stroke-linecap="round"/><path d="M665 294 L695 315 L665 336" fill="none" stroke="#ff6a00" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(710 215)">
  <circle cx="120" cy="100" r="76" fill="#ff6a00"/><text x="120" y="112" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="white">03</text>
  <text x="120" y="230" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#171717">Serve chilled</text>
  <text x="120" y="268" text-anchor="middle" font-family="Arial" font-size="20" fill="#666">Makes about 9.8–10 L</text>
</g>
<rect x="160" y="560" width="880" height="120" rx="24" fill="white" stroke="#eadfd7"/>
<text x="600" y="610" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#171717">Tip: Add a little extra sugar if you prefer a sweeter taste.</text>
<text x="600" y="648" text-anchor="middle" font-family="Arial" font-size="20" fill="#777">Blending gives a smoother, lump-free juice.</text>
</svg>
