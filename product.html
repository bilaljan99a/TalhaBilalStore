<script>
const SUPABASE_URL='https://dxdjqeqlmyawqrzphzdb.supabase.co';const SUPABASE_KEY='sb_publishable__VZebPfljfwPNTxcWbDD7Q_pzIJvn_K';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const currency=v=>`Rs. ${Number(v).toLocaleString('en-PK')}`;const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const DELIVERY_FEES={1:200,2:290,3:380,4:470,5:570,6:655,7:750,8:841,9:950,10:1030};const deliveryForWeight=weight=>{const w=Math.max(0,Math.ceil(Number(weight)||0));if(!w)return 0;if(w<=10)return DELIVERY_FEES[w];const tens=Math.floor(w/10),remainder=w%10;return tens*DELIVERY_FEES[10]+(remainder?DELIVERY_FEES[remainder]:0)};const detail=document.getElementById('detail');let selectedId=new URLSearchParams(location.search).get('id')||'mango-1kg';let p=PRODUCTS.find(x=>x.id===selectedId)||PRODUCTS[0];const STATIC_REVIEWS=(typeof CUSTOMER_REVIEWS!=='undefined'&&Array.isArray(CUSTOMER_REVIEWS))?CUSTOMER_REVIEWS:[];
function reviewRows(rows){const base=STATIC_REVIEWS.map(r=>({name:r.customer_name||r.name||'Customer',rating:Number(r.rating)||5,text:r.review_text||r.text||'',images:Array.isArray(r.image_urls)?r.image_urls:(r.image?[r.image]:[])}));const dynamic=(rows||[]).map(r=>({name:r.customer_name||'Customer',rating:Number(r.rating)||5,text:r.review_text||'',images:Array.isArray(r.image_urls)?r.image_urls:[]}));const out=[...base];dynamic.forEach(r=>{if(r.text&&!out.some(x=>x.name===r.name&&x.text===r.text))out.push(r)});return out.filter(r=>r.text)}
function reviewMarkup(rows){const data=reviewRows(rows);if(!data.length)return '<div class="empty-reviews">There are no reviews currently.</div>';return `<div class="detail-reviews">${data.map(r=>`<article class="detail-review"><div class="review-top"><strong>${esc(r.name)}</strong><span class="review-stars" aria-label="${r.rating} out of 5 stars">${'★'.repeat(Math.min(5,r.rating))}${'☆'.repeat(Math.max(0,5-r.rating))}</span></div><p>${esc(r.text)}</p>${r.images.length?`<div class="detail-review-photos">${r.images.slice(0,3).map(u=>`<img src="${esc(u)}" alt="Customer review photo" loading="lazy">`).join('')}</div>`:''}</article>`).join('')}</div>`}
function gallery(){const images=[{src:'assets/products/mango-pulp-product-image.webp',alt:'Mango Pulp Drink Premix product on a plain white background'},{src:p.image,alt:`${p.name} product image`},{src:'assets/how-to-prepare-mango-juice.png',alt:'How to prepare Mango Juice'}];return `<div class="product-gallery"><div class="gallery-main"><img id="galleryMain" src="${images[0].src}" alt="${images[0].alt}"></div><div class="gallery-thumbs" role="list">${images.map((im,i)=>`<button class="gallery-thumb ${i===0?'active':''}" type="button" data-gallery-src="${im.src}" data-gallery-alt="${im.alt}" aria-label="View product image ${i+1}"><img src="${im.src}" alt="" loading="lazy"></button>`).join('')}</div></div>`}
function setSeo(){document.title=`${p.name} | Talha Bilal Store`;const meta=document.querySelector('meta[name="description"]');if(meta)meta.content=`${p.name} — Mango Pulp Drink Premix with preparation method, ingredients, nutrition, delivery information and customer reviews.`;document.querySelectorAll('script[data-product-schema]').forEach(s=>s.remove());const schema=document.createElement('script');schema.type='application/ld+json';schema.dataset.productSchema='true';schema.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Product','name':p.name,'description':p.description,'image':new URL(p.image,location.href).href,'brand':{'@type':'Brand','name':'Talha Bilal Store'},'offers':{'@type':'Offer','priceCurrency':'PKR','price':String(p.price),'availability':'https://schema.org/InStock','url':location.href}});document.head.appendChild(schema)}

te if you prefer a sweeter drink.</div></div></div><p class="note">💡 Tip: A juicer or blender gives a smooth, lump-free result.</p></div></details><details><summary>Delivery Information <span>⌄</span></summary><div class="accordion-content"><p>Cash on Delivery is available. The delivery fee is calculated from the total cart weight and is shown clearly before you place your order. For this ${p.weight}kg pack, the delivery fee is ${currency(delivery)}.</p></div></details><details><summary>Ingredients <span>⌄</span></summary><div class="accordion-content"><ul><li>Water</li><li>Sugar</li><li>Mango Pulp 60%</li><li>Acidity Regulators: Citric Acid, Sodium Citrate (E331)</li><li>Thickening Agents: Xanthan Gum, Guar Gum (E412)</li><li>Preservative: Sodium Benzoate (E211)</li><li>Permitted Food Colors: E102–E110, Beta Carotene (E160)</li><li>Artificial Flavor (Mango-SMC)</li><li>Titanium Dioxide (Color Enhancer E171)</li></ul><p class="note">Ingredients are transcribed from the product information provided for the store. Please follow the physical pack label for the latest ingredient information.</p></div></details><details><summary>Nutrition Information <span>⌄</span></summary><div class="accordion-content nutrition"><table><thead><tr><th>Per 100 ml</th><th>Amount</th></tr></thead><tbody><tr><td>Energy</td><td>122 kcal</td></tr><tr><td>Carbohydrate</td><td>30 g</td></tr><tr><td>of which sugar</td><td>10 g</td></tr><tr><td>Fat</td><td>0 g</td></tr><tr><td>Protein</td><td>0.53 g</td></tr></tbody></table><p class="note">Net weight when packed: 1000 g ± 50 g.</p></div></details></section><section class="detail-section customer-reviews-section"><div class="section-heading"><div><span class="eyebrow">CUSTOMER REVIEWS</span><h2>What Customers Say</h2></div><p>The same Mango Pulp feedback shown on the homepage is displayed across all pack sizes.</p></div><div id="productReviews"></div></section><div class="detail-bottom-link"><a class="detail-back" href="products.html">← All Products</a></div>`;
const size=document.getElementById('mangoSize');size?.addEventListener('change',()=>{selectedId=size.value;p=PRODUCTS.find(x=>x.id===selectedId)||PRODUCTS[0];history.replaceState({},'',`product.html?id=${encodeURIComponent(p.id)}`);renderProduct();loadReviews()});document.querySelectorAll('[data-gallery-src]').forEach(btn=>btn.addEventListener('click',()=>{const main=document.getElementById('galleryMain');if(!main)return;main.src=btn.dataset.gallerySrc;main.alt=btn.dataset.galleryAlt;document.querySelectorAll('.gallery-thumb').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}))}
async function loadReviews(){const box=document.getElementById('productReviews');if(!box)return;box.innerHTML=reviewMarkup([]);try{const {data,error}=await supabaseClient.from('reviews').select('customer_name,rating,review_text,image_urls,created_at').eq('approved',true).order('created_at',{ascending:false});if(!error)box.innerHTML=reviewMarkup(data||[])}catch{}}
renderProduct();loadReviews();
</script>
